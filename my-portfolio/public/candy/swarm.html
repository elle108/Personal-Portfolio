<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Swarm</title>
<!-- Same fonts as the portfolio -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Quicksand:wght@500;600;700&display=swap">
<style>body { margin: 0; }</style>
<!-- D3 v7 from cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  #candy-swarm { font-family: Quicksand, Helvetica, Arial, sans-serif; color: #4a3f55; max-width: 860px; background: #fff; padding: 8px; }
  #candy-swarm h3 { margin: 0 0 8px; color: #4a3f55; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 24px; }
  /* #candy-swarm .sub { margin: 0 0 12px; color: #666; font-size: 14px; } */
  #candy-swarm .buttons button {
    font: inherit; font-size: 14px; padding: 6px 14px; margin: 0 6px 6px 0;
    border: 2px solid #f6b3cf; background: #fff; color: #c2558a; font-weight: 600; border-radius: 18px; cursor: pointer;
  }
  #candy-swarm .buttons button.active { background: #c2558a; border-color: #c2558a; color: #fff; }
  #candy-swarm .buttons button:hover:not(.active) { background: #fde4ef; }
  #candy-swarm .note { min-height: 40px; font-size: 14px; color: #776b84; margin: 4px 0 6px; }
  #candy-swarm .tip {
    position: absolute; pointer-events: none; background: #4a3f55; color: #fff; padding: 6px 9px;
    border-radius: 6px; font-size: 13px; line-height: 1.35; opacity: 0;
  }
  #candy-swarm .group-label { font-size: 14px; font-weight: bold; }
  #candy-swarm .avg-label { font-size: 12px; fill: #776b84; }
  #candy-swarm .axis text { font-size: 12px; fill: #776b84; }
  #candy-swarm .axis path, #candy-swarm .axis line { stroke: #f0e4ee; }
</style>
</head>
<body>
<div id="candy-swarm">
  <h3>Every candy, one dot</h3>
  <!-- <p class="sub">Each dot is one candy, placed by how often it won. Hover over a dot to see which candy it is.</p> -->
  <div class="buttons">
    <button data-mode="all" class="active">All candy</button>
    <button data-mode="form">Group by form</button>
    <button data-mode="family">Group by flavor</button>
  </div>
  <p class="note"></p>
  <div class="chart"></div>
  <div class="tip"></div>
</div>

<script>
// Beeswarm layout adapted from the D3 gallery examples
// (https://observablehq.com/@d3/beeswarm) and the d3-force docs (https://d3js.org/d3-force).
function startSwarm() {
  const DATA_URL = "https://raw.githubusercontent.com/fivethirtyeight/data/master/candy-power-ranking/candy-data.csv";
  // Portfolio palette: rose, violet, and blue
  const COLORS = { Chocolate: "#c2558a", Fruity: "#7c62d6", Other: "#3f7fc0" };
  const GROUPS = {
    all: ["All candy"],
    form: ["Bar", "Many pieces", "Single piece"],
    family: ["Chocolate", "Fruity", "Other"]
  };
  const NOTES = {
    all: "85 candies from about 269,000 head to head votes. Most land between 35% and 70%, with a few big winners on the right.",
    form: "Bars look like the clear winners here BUT look at the colors, almost every bar is chocolate.",
    family: "Grouped by flavor, almost all of the top candies are chocolate and most fruity candies sit in the middle."
  };

  const root = d3.select("#candy-swarm");
  const width = 820, rowH = 150, margin = { top: 10, right: 30, bottom: 40, left: 120 }, r = 7;
  const x = d3.scaleLinear().domain([20, 90]).range([margin.left, width - margin.right]);

  const svg = root.select(".chart").append("svg")
    .attr("viewBox", `0 0 ${width} ${margin.top + rowH * 3 + margin.bottom}`)
    .style("width", "100%").style("height", "auto");
  const xAxisG = svg.append("g").attr("class", "axis");
  const labelsG = svg.append("g");
  const avgG = svg.append("g");
  const dotsG = svg.append("g");
  const tip = root.select(".tip");

  d3.csv(DATA_URL, d3.autoType).then(raw => {
    const candy = raw.map(d => ({
      name: d.competitorname.replace(/Õ/g, "'"),
      win: d.winpercent,
      family: d.chocolate ? "Chocolate" : d.fruity ? "Fruity" : "Other",
      form: d.bar ? "Bar" : d.pluribus ? "Many pieces" : "Single piece",
      peanuts: d.peanutyalmondy === 1
    }));
    candy.forEach(d => { d.x = x(d.win); d.y = margin.top + rowH * 1.5; });

    const dots = dotsG.selectAll("circle").data(candy).join("circle")
      .attr("r", r)
      .attr("fill", d => COLORS[d.family])
      .attr("stroke", "#fff").attr("stroke-width", 1)
      .on("mousemove", (event, d) => {
        const box = root.node().getBoundingClientRect();
        tip.style("opacity", 1)
          .style("left", (event.clientX - box.left + 12) + "px")
          .style("top", (event.clientY - box.top + 12) + "px")
          .html(`<b>${d.name}</b><br>Won ${d.win.toFixed(1)}% of matchups<br>${d.family} · ${d.form}${d.peanuts ? " · has peanuts" : ""}`);
      })
      .on("mouseleave", () => tip.style("opacity", 0));

    // Force simulation: pull each dot toward its win % (x) and its group's row (y), without overlapping
    // (run by hand below, then animated, so the dots glide instead of jumping)
    const sim = d3.forceSimulation(candy)
      .force("x", d3.forceX(d => x(d.win)).strength(1))
      .force("collide", d3.forceCollide(r + 1))
      .stop();
    dots.attr("cx", d => x(d.win)).attr("cy", margin.top + rowH / 2);

    function draw(mode) {
      const groups = GROUPS[mode];
      const height = margin.top + rowH * groups.length + margin.bottom;
      svg.transition().duration(600).attr("viewBox", `0 0 ${width} ${height}`);
      const rowY = g => margin.top + rowH * groups.indexOf(g) + rowH / 2;
      const groupOf = d => mode === "all" ? "All candy" : d[mode];

      xAxisG.transition().duration(600)
        .attr("transform", `translate(0, ${height - margin.bottom})`)
        .call(d3.axisBottom(x).ticks(7).tickFormat(d => d + "%"));

      labelsG.selectAll("text").data(groups, g => g).join("text")
        .attr("class", "group-label").attr("x", 10).attr("y", g => rowY(g) + 5)
        .attr("fill", g => COLORS[g] || "#4a3f55").text(g => g);

      // Average line for each group, so readers can compare groups at a glance
      const avgs = groups.map(g => ({ g, avg: d3.mean(candy.filter(d => groupOf(d) === g), d => d.win) }));
      const avg = avgG.selectAll("g.avg").data(avgs, d => d.g).join(enter => {
        const a = enter.append("g").attr("class", "avg");
        a.append("line").attr("stroke", "#776b84").attr("stroke-dasharray", "3,3");
        a.append("text").attr("class", "avg-label").attr("text-anchor", "middle");
        return a;
      });
      avg.select("line").attr("x1", d => x(d.avg)).attr("x2", d => x(d.avg))
        .attr("y1", d => rowY(d.g) - rowH / 2 + 8).attr("y2", d => rowY(d.g) + rowH / 2 - 22);
      avg.select("text").attr("x", d => x(d.avg)).attr("y", d => rowY(d.g) + rowH / 2 - 8)
        .text(d => `avg ${d.avg.toFixed(1)}%`);

      root.select(".note").text(NOTES[mode]);
      // Drop each dot near its new row first so the groups mix and settle cleanly
      candy.forEach(d => { d.y = rowY(groupOf(d)) + (Math.random() - 0.5) * 20; });
      sim.force("y", d3.forceY(d => rowY(groupOf(d))).strength(0.35)).alpha(1);
      for (let i = 0; i < 300; i++) sim.tick();
      dots.transition().duration(900).ease(d3.easeCubicInOut)
        .delay(d => d.win * 4)
        .attr("cx", d => d.x).attr("cy", d => d.y);
    }

    root.selectAll(".buttons button").on("click", function () {
      root.selectAll(".buttons button").classed("active", false);
      d3.select(this).classed("active", true);
      draw(this.dataset.mode);
    });
    draw("all");
  }).catch(err => {
    // Show the problem on the page instead of leaving a blank chart
    root.select(".note").text("The chart could not load: " + err.message);
  });
}

// Wait for D3 to finish loading before drawing (Colab can run this before the library is ready)
if (window.d3) {
  startSwarm();
} else {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js";
  s.onload = startSwarm;
  document.head.appendChild(s);
}
</script>
<script>
// Tell the portfolio page how tall this chart is so its frame can fit it
new ResizeObserver(() => {
  parent.postMessage({ candyChart: "swarm", height: document.body.scrollHeight }, "*");
}).observe(document.body);
</script>
</body>
</html>
